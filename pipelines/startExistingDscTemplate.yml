parameters:
- name: poolName
  type: string

stages:
- stage: StartExistingConfiguration
  displayName: Start existing DSC configuration
  dependsOn:
  - GenerateBuildEnvironmentMatrix
  - Initialize
  jobs:
  - job: StartExistingConfiguration
    displayName: Deploy to $(BuildEnvironment)
    strategy:
      matrix: $[ stageDependencies.GenerateBuildEnvironmentMatrix.CreateBuildEnvironmentMatrix.outputs['setMatrix.buildEnvironmentMatrix'] ]
    pool:
      name: ${{ parameters.poolName }}
      demands:
      - buildEnvironment -equals $(BuildEnvironment)
    steps:
    - download: None

    - task: PowerShell@2
      name: displayEnvVariables2
      displayName: Display Environment Variables
      inputs:
        targetType: inline
        script: |
          dir -Path env: | Format-Table -Property Name, Value -AutoSize | Out-String | Write-Host

    - task: PowerShell@2
      name: deploy
      displayName: Deploy DSC Configuration
      inputs:
        filePath: ./build.ps1
        arguments: -Tasks startExistingDscConfiguration
        pwsh: false
