parameters:
- name: poolName
  type: string

stages:
- stage: Build
  displayName: Build DSC artifacts
  dependsOn: GenerateBuildEnvironmentMatrix
  jobs:
  - job: Build
    displayName: Build of $(BuildEnvironment)
    strategy:
      matrix: $[ stageDependencies.GenerateBuildEnvironmentMatrix.CreateBuildEnvironmentMatrix.outputs['setMatrix.buildEnvironmentMatrix'] ]
    pool:
      name: ${{ parameters.poolName }}
      demands:
      - buildEnvironment -equals $(BuildEnvironment)
    steps:
    - task: PowerShell@2
      name: displayEnvVariables
      displayName: Display Environment Variables
      inputs:
        targetType: inline
        pwsh: true
        script: |
          dir -Path env: | Format-Table -Property Name, Value -AutoSize | Out-String | Write-Host

    - task: PowerShell@2
      name: clean
      displayName: Clean Program Files Modules
      inputs:
        pwsh: true
        filePath: ./build.ps1
        arguments: -ResolveDependency -Tasks InitializeModuleFolder #-UseModuleFast

    - task: PowerShell@2
      name: runtimePreflight
      displayName: Verify PowerShell and Pester
      inputs:
        pwsh: true
        filePath: ./pipelines/scripts/TestBuildRuntime.ps1

    - task: PowerShell@2
      name: build
      displayName: Build DSC Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          ./build.ps1 -Tasks build -Filter { $_.Environment -eq $env:BuildEnvironment }

    - task: PowerShell@2
      name: pack
      displayName: Pack DSC Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          ./build.ps1 -Tasks pack -Filter { $_.Environment -eq $env:BuildEnvironment }
      enabled: false

    - task: PublishPipelineArtifact@1
      displayName: Publish MOF Files for $(BuildEnvironment)
      inputs:
        targetPath: $(buildFolderName)/MOF
        artifact: MOF_$(BuildEnvironment)
        publishLocation: pipeline
        parallel: true

    - task: PublishPipelineArtifact@1
      displayName: Publish RSOP Files for $(BuildEnvironment)
      inputs:
        targetPath: $(buildFolderName)/RSOP
        artifact: RSOP_$(BuildEnvironment)
        publishLocation: pipeline
        parallel: true
