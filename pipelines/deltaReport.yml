trigger: none

parameters:
  - name: sourceTenant
    displayName: Source tenant of the delta report
    type: string
    default: MngEnvMCAP289781.onmicrosoft.com
  - name: createSyntheticDestination
    displayName: Create a synthetic destination tenant (test only)
    type: boolean
    default: false
  - name: anonymizeTenantIdentifiers
    displayName: Replace tenant identifiers with environment names
    type: boolean
    default: false

variables:
  buildFolderName: output
  defaultBranch: main
  Agent.Source.Git.ShallowFetchDepth: 0

resources:
  pipelines:
    - pipeline: exportPipeline
      source: M365DSC export
      trigger: none

pool:
  vmImage: windows-latest

steps:
  - task: PowerShell@2
    name: displayEnvVariables
    displayName: Display Environment Variables
    inputs:
      targetType: inline
      pwsh: true
      script: |
        dir -Path env: | Format-Table -Property Name, Value -AutoSize | Out-String | Write-Host

  - download: exportPipeline
    patterns: "**"
    displayName: Download Exported Tenant Configurations

  - ${{ if eq(parameters.createSyntheticDestination, true) }}:
    - task: PowerShell@2
      displayName: Create synthetic destination for testing
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $inputDirectory = $env:DeltaReportInputDirectory
          $sourceTenant = $env:DeltaReportSourceTenant
          $syntheticTenant = 'delta-report-test.onmicrosoft.com'

          if (-not (Test-Path -LiteralPath $inputDirectory -PathType Container)) {
            throw "Export input directory '$inputDirectory' does not exist."
          }

          if ($syntheticTenant -eq $sourceTenant) {
            throw "The synthetic tenant name '$syntheticTenant' must differ from the source tenant."
          }

          $sourceConfigurations = @(Get-ChildItem -LiteralPath $inputDirectory -Filter '*.ps1' -File -Recurse -ErrorAction Stop |
            Where-Object { $_.Directory.Parent.Name -eq $sourceTenant })
          if ($sourceConfigurations.Count -eq 0) {
            throw "No exported configuration files were found for source tenant '$sourceTenant' in '$inputDirectory'."
          }

          $sourceFolders = @($sourceConfigurations |
            ForEach-Object { $_.Directory.Parent.FullName } |
            Sort-Object -Unique)
          if ($sourceFolders.Count -ne 1) {
            throw "Expected one export folder for source tenant '$sourceTenant', found $($sourceFolders.Count): $($sourceFolders -join ', ')."
          }

          $syntheticFolder = Join-Path -Path $inputDirectory -ChildPath $syntheticTenant
          if (Test-Path -LiteralPath $syntheticFolder) {
            throw "Synthetic tenant folder '$syntheticFolder' already exists. Refusing to overwrite it."
          }

          New-Item -Path $syntheticFolder -ItemType Directory -ErrorAction Stop | Out-Null
          Get-ChildItem -LiteralPath $sourceFolders[0] -Force -ErrorAction Stop |
            Copy-Item -Destination $syntheticFolder -Recurse -Force -ErrorAction Stop

          $copiedConfigurations = @(Get-ChildItem -LiteralPath $syntheticFolder -Filter '*.ps1' -File -Recurse -ErrorAction Stop)
          if ($copiedConfigurations.Count -eq 0) {
            throw "No configuration files were copied to synthetic tenant folder '$syntheticFolder'."
          }

          $repositoryDirectory = if ($env:BUILD_SOURCESDIRECTORY) { $env:BUILD_SOURCESDIRECTORY } else { (Get-Location).Path }
          $exportConfigurationPath = Join-Path -Path $repositoryDirectory -ChildPath 'export\ExportConfiguration.yml'
          if (-not (Test-Path -LiteralPath $exportConfigurationPath -PathType Leaf)) {
            throw "Export configuration file '$exportConfigurationPath' was not found."
          }

          $inDscResources = $false
          $exportedResourceNames = @(
            foreach ($line in (Get-Content -LiteralPath $exportConfigurationPath -ErrorAction Stop)) {
              if (-not $inDscResources) {
                if ($line -match '^DscResources:\s*$') {
                  $inDscResources = $true
                }
                continue
              }
              if ([string]::IsNullOrWhiteSpace($line)) {
                continue
              }
              if ($line -match '^\s*-\s*(?<name>[A-Za-z0-9_]+)\s*$') {
                $Matches['name']
                continue
              }
              break
            }
          )
          if ($exportedResourceNames.Count -eq 0) {
            throw "No resources were found under DscResources in '$exportConfigurationPath'."
          }

          $marker = [guid]::NewGuid().ToString('N').Substring(0, 8)
          $syntheticDifferenceCount = 0
          $modifiedResources = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $stringAssignmentPattern = '(?:''(?:''''|[^''])*''|"(?:`"|[^"])*"|\[System\.String\]\$null|\$null)'
          function Set-SyntheticExportProperty {
            param (
              [Parameter(Mandatory = $true)]
              [string]$ResourceName,
              [Parameter(Mandatory = $true)]
              [string]$PropertyName,
              [Parameter(Mandatory = $true)]
              [string]$ValuePattern,
              [Parameter(Mandatory = $true)]
              [scriptblock]$Transform
            )

            $configurations = @($copiedConfigurations | Where-Object { $_.Directory.Name -eq $ResourceName } | Sort-Object -Property FullName)
            foreach ($configuration in $configurations) {
              $content = Get-Content -LiteralPath $configuration.FullName -Raw -ErrorAction Stop
              $propertyPattern = "(?im)^(?<prefix>[ \t]*$([regex]::Escape($PropertyName))[ \t]*=[ \t]*)(?<value>$ValuePattern)(?<suffix>[ \t]*;?[ \t]*(?:#.*)?\r?)$"
              $assignment = [regex]::Match($content, $propertyPattern)
              if (-not $assignment.Success) {
                continue
              }

              $currentValue = $assignment.Groups['value'].Value
              $newValue = [string](& $Transform $currentValue)
              $updatedContent = $content.Remove($assignment.Groups['value'].Index, $assignment.Groups['value'].Length).Insert($assignment.Groups['value'].Index, $newValue)
              Set-Content -LiteralPath $configuration.FullName -Value $updatedContent -NoNewline -Encoding utf8 -ErrorAction Stop
              Write-Host "Changed the copied $ResourceName.$PropertyName value in '$($configuration.FullName)'."
              $null = $modifiedResources.Add($ResourceName)
              return $true
            }

            Write-Warning "No exported $ResourceName.$PropertyName assignment was found for '$sourceTenant'; another exported property will be used for synthetic drift."
            return $false
          }

          function Add-SyntheticResourcePair {
            param (
              [Parameter(Mandatory = $true)]
              [string]$ResourceName,
              [Parameter(Mandatory = $true)]
              [string]$SourceBlock,
              [Parameter(Mandatory = $true)]
              [string]$DestinationBlock
            )

            foreach ($tenant in @(
              @{ Path = $sourceFolders[0]; Block = $SourceBlock }
              @{ Path = $syntheticFolder; Block = $DestinationBlock }
            )) {
              $resourceFolder = Join-Path -Path $tenant.Path -ChildPath $ResourceName
              New-Item -Path $resourceFolder -ItemType Directory -Force -ErrorAction Stop | Out-Null
              $configurationFile = Get-ChildItem -LiteralPath $resourceFolder -Filter '*.ps1' -File -ErrorAction Stop |
                Sort-Object -Property FullName |
                Select-Object -First 1
              if ($configurationFile) {
                $content = Get-Content -LiteralPath $configurationFile.FullName -Raw -ErrorAction Stop
                $tokens = $null
                $parseErrors = $null
                $ast = [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$tokens, [ref]$parseErrors)
                $node = $ast.Find({
                  param ($item)
                  $item -is [System.Management.Automation.Language.DynamicKeywordStatementAst] -and
                    $item.CommandElements[0].Value -eq 'Node'
                }, $true)
                $nodeBlock = if ($node) {
                  @($node.CommandElements | Where-Object { $_ -is [System.Management.Automation.Language.ScriptBlockExpressionAst] } |
                    Select-Object -First 1)[0].ScriptBlock
                }

                if ($nodeBlock) {
                  $closeBraceIndex = $nodeBlock.Extent.EndOffset - 1
                  $insertIndex = $content.LastIndexOf("`n", $closeBraceIndex) + 1
                  $updatedContent = $content.Insert($insertIndex, $tenant.Block + [Environment]::NewLine)
                  Set-Content -LiteralPath $configurationFile.FullName -Value $updatedContent -NoNewline -Encoding utf8 -ErrorAction Stop
                } elseif ([string]::IsNullOrWhiteSpace($content)) {
                  $configurationName = "SyntheticDeltaReport_$ResourceName`_$marker"
                  $configurationContent = @(
                    "Configuration $configurationName"
                    '{'
                    '    Import-DscResource -ModuleName Microsoft365DSC'
                    '    Node localhost'
                    '    {'
                    $tenant.Block
                    '    }'
                    '}'
                  ) -join [Environment]::NewLine
                  Set-Content -LiteralPath $configurationFile.FullName -Value $configurationContent -Encoding utf8 -ErrorAction Stop
                } else {
                  throw "Could not locate a Node localhost block in '$($configurationFile.FullName)' to add synthetic $ResourceName drift."
                }
              } else {
                $configurationPath = Join-Path -Path $resourceFolder -ChildPath 'M365TenantConfig.ps1'
                $configurationName = "SyntheticDeltaReport_$ResourceName`_$marker"
                $configurationContent = @(
                  "Configuration $configurationName"
                  '{'
                  '    Import-DscResource -ModuleName Microsoft365DSC'
                  '    Node localhost'
                  '    {'
                  $tenant.Block
                  '    }'
                  '}'
                ) -join [Environment]::NewLine
                Set-Content -LiteralPath $configurationPath -Value $configurationContent -Encoding utf8 -ErrorAction Stop
              }
            }

            $null = $modifiedResources.Add($ResourceName)
            Write-Host "Added matching synthetic $ResourceName instances to the copied source and destination exports."
          }

          function Set-SyntheticPairedProperty {
            param (
              [Parameter(Mandatory = $true)]
              [string]$ResourceName,
              [Parameter(Mandatory = $true)]
              [string]$PropertyName,
              [Parameter(Mandatory = $true)]
              [string]$SourceValue,
              [Parameter(Mandatory = $true)]
              [string]$DestinationValue
            )

            $anchorPattern = '(?im)^(?<indent>[ \t]*)IsSingleInstance[ \t]*=[ \t]*[''"]Yes[''"][ \t]*;?[ \t]*(?:#.*)?\r?$'
            foreach ($tenant in @(
              @{ Path = $sourceFolders[0]; Value = $SourceValue }
              @{ Path = $syntheticFolder; Value = $DestinationValue }
            )) {
              $resourceFolder = Join-Path -Path $tenant.Path -ChildPath $ResourceName
              $configurationFile = Get-ChildItem -LiteralPath $resourceFolder -Filter '*.ps1' -File -ErrorAction Stop |
                Sort-Object -Property FullName |
                Select-Object -First 1
              if (-not $configurationFile) {
                throw "No copied configuration file was found for '$ResourceName' under '$resourceFolder'."
              }

              $content = Get-Content -LiteralPath $configurationFile.FullName -Raw -ErrorAction Stop
              $anchor = [regex]::Match($content, $anchorPattern)
              if (-not $anchor.Success) {
                throw "No IsSingleInstance = 'Yes' assignment was found for '$ResourceName' in '$($configurationFile.FullName)'."
              }

              $lineEnd = $content.IndexOf("`n", $anchor.Index + $anchor.Length)
              $insertIndex = if ($lineEnd -ge 0) { $lineEnd + 1 } else { $content.Length }
              $propertyLine = "$($anchor.Groups['indent'].Value)    $PropertyName = $($tenant.Value)$([Environment]::NewLine)"
              if ($lineEnd -lt 0) {
                $propertyLine = [Environment]::NewLine + $propertyLine
              }
              $updatedContent = $content.Insert($insertIndex, $propertyLine)
              Set-Content -LiteralPath $configurationFile.FullName -Value $updatedContent -NoNewline -Encoding utf8 -ErrorAction Stop
              Write-Host "Set the copied $ResourceName.$PropertyName value to '$($tenant.Value)' in '$($configurationFile.FullName)'."
            }

            $null = $modifiedResources.Add($ResourceName)
          }

          $modifiedConfiguration = $null
          $modifiedProperty = $null
          $authMethodConfigurations = @($copiedConfigurations | Where-Object { $_.Directory.Name -eq 'AADAuthenticationMethodPolicyTemporary' } | Sort-Object -Property FullName)
          foreach ($configuration in $authMethodConfigurations) {
            $content = Get-Content -LiteralPath $configuration.FullName -Raw -ErrorAction Stop
            $propertyPattern = '(?im)^(?<prefix>[ \t]*DefaultLifetimeInMinutes[ \t]*=[ \t]*)(?<value>\d+)(?<suffix>[ \t]*(?:#.*)?\r?)$'
            $assignment = [regex]::Match($content, $propertyPattern)
            if (-not $assignment.Success) {
              continue
            }

            $currentValue = [int]$assignment.Groups['value'].Value
            $random = [System.Security.Cryptography.RandomNumberGenerator]::GetInt32(10, 43201)
            while ($random -eq $currentValue) {
              $random = [System.Security.Cryptography.RandomNumberGenerator]::GetInt32(10, 43201)
            }

            $updatedContent = $content.Remove($assignment.Groups['value'].Index, $assignment.Groups['value'].Length).Insert($assignment.Groups['value'].Index, [string]$random)
            Set-Content -LiteralPath $configuration.FullName -Value $updatedContent -NoNewline -Encoding utf8 -ErrorAction Stop
            $modifiedConfiguration = $configuration.FullName
            $modifiedProperty = "DefaultLifetimeInMinutes ($currentValue -> $random)"
            break
          }

          if ($modifiedConfiguration) {
            Write-Host "Changed '$modifiedProperty' in '$modifiedConfiguration'."
            $syntheticDifferenceCount++
            $null = $modifiedResources.Add('AADAuthenticationMethodPolicyTemporary')
          } else {
            Write-Warning "No exported AADAuthenticationMethodPolicyTemporary DefaultLifetimeInMinutes property was found for '$sourceTenant'; another exported property will be used for synthetic drift."
          }

          $booleanAssignmentPattern = '\$(?:true|false)'
          if (Set-SyntheticExportProperty -ResourceName 'AADConditionalAccessPolicy' -PropertyName 'State' -ValuePattern $stringAssignmentPattern -Transform {
            param ($value)
            if ($value -match '(?i)^[''"]disabled[''"]$') { "'enabled'" } else { "'disabled'" }
          }) {
            $syntheticDifferenceCount++
          }
          if (Set-SyntheticExportProperty -ResourceName 'AADAuthenticationMethodPolicy' -PropertyName 'ReconfirmationInDays' -ValuePattern '\d+' -Transform {
            param ($value)
            [string]([int]$value + 1)
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADAuthenticationMethodPolicyExternal' -PropertyName 'State' -ValuePattern $stringAssignmentPattern -Transform {
            param ($value)
            if ($value -match '(?i)^[''"]disabled[''"]$') { "'enabled'" } else { "'disabled'" }
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADSecurityDefaults' -PropertyName 'IsEnabled' -ValuePattern $booleanAssignmentPattern -Transform {
            param ($value)
            if ($value -match '(?i)\$true') { '$False' } else { '$True' }
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADApplication' -PropertyName 'Description' -ValuePattern $stringAssignmentPattern -Transform {
            param ($value)
            "'DeltaReport synthetic test $marker'"
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADApplication' -PropertyName 'Notes' -ValuePattern $stringAssignmentPattern -Transform {
            param ($value)
            "'DeltaReport synthetic test notes $marker'"
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADGroupsSettings' -PropertyName 'UsageGuidelinesUrl' -ValuePattern $stringAssignmentPattern -Transform {
            param ($value)
            "'https://delta-report-test.invalid/groups/$marker'"
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADGroupsSettings' -PropertyName 'GuestUsageGuidelinesUrl' -ValuePattern $stringAssignmentPattern -Transform {
            param ($value)
            "'https://delta-report-test.invalid/guests/$marker'"
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADAuthenticationStrengthPolicy' -PropertyName 'Description' -ValuePattern $stringAssignmentPattern -Transform {
            param ($value)
            "'DeltaReport synthetic authentication strength $marker'"
          }) { $syntheticDifferenceCount++ }
          if (Set-SyntheticExportProperty -ResourceName 'AADAuthenticationContextClassReference' -PropertyName 'IsAvailable' -ValuePattern $booleanAssignmentPattern -Transform {
            param ($value)
            if ($value -match '(?i)\$true') { '$False' } else { '$True' }
          }) { $syntheticDifferenceCount++ }

          $ensurePattern = '(?im)^(?<prefix>[ \t]*Ensure[ \t]*=[ \t]*)(?<value>[''"]Present[''"])(?<suffix>[ \t]*;?[ \t]*(?:#.*)?\r?)$'
          $scalarAssignmentPattern = '(?im)^(?<prefix>[ \t]*(?<property>[A-Za-z][A-Za-z0-9_]*)[ \t]*=[ \t]*)(?<value>\$(?:true|false)|\d+|' + $stringAssignmentPattern + ')(?<suffix>[ \t]*;?[ \t]*(?:#.*)?\r?)$'
          foreach ($resourceName in $exportedResourceNames) {
            if ($modifiedResources.Contains($resourceName)) {
              continue
            }

            $resourceConfigurations = @($copiedConfigurations | Where-Object { $_.Directory.Name -eq $resourceName } | Sort-Object -Property FullName)
            $modifiedEnsure = $false
            foreach ($configuration in $resourceConfigurations) {
              $content = Get-Content -LiteralPath $configuration.FullName -Raw -ErrorAction Stop
              $assignment = [regex]::Match($content, $ensurePattern)
              if ($assignment.Success) {
                $quote = $assignment.Groups['value'].Value.Substring(0, 1)
                $newValue = "${quote}Absent${quote}"
                $updatedContent = $content.Remove($assignment.Groups['value'].Index, $assignment.Groups['value'].Length).Insert($assignment.Groups['value'].Index, $newValue)
                Set-Content -LiteralPath $configuration.FullName -Value $updatedContent -NoNewline -Encoding utf8 -ErrorAction Stop
                $null = $modifiedResources.Add($resourceName)
                $syntheticDifferenceCount++
                Write-Host "Changed the copied $resourceName.Ensure value to Absent in '$($configuration.FullName)'."
                $modifiedEnsure = $true
                break
              }

              $scalarAssignments = [regex]::Matches($content, $scalarAssignmentPattern)
              foreach ($scalarAssignment in $scalarAssignments) {
                $propertyName = $scalarAssignment.Groups['property'].Value
                if ($propertyName -match '^(?i:Ensure|IsSingleInstance|ApplicationId|TenantId|CertificateThumbprint|Id|ObjectId|PolicyId|AccessToken)$') {
                  continue
                }

                $currentValue = $scalarAssignment.Groups['value'].Value
                if ($currentValue -match '^\$(?:true|false)$') {
                  $newValue = if ($currentValue -match '(?i)\$true') { '$False' } else { '$True' }
                } elseif ($currentValue -match '^\d+$') {
                  $number = [long]$currentValue
                  $newValue = if ($number -lt [long]::MaxValue) { [string]($number + 1) } else { [string]($number - 1) }
                } elseif ($currentValue.StartsWith('"')) {
                  $newValue = "`"DeltaReport synthetic test $marker`""
                } else {
                  $newValue = "'DeltaReport synthetic test $marker'"
                }

                $updatedContent = $content.Remove($scalarAssignment.Groups['value'].Index, $scalarAssignment.Groups['value'].Length).Insert($scalarAssignment.Groups['value'].Index, $newValue)
                Set-Content -LiteralPath $configuration.FullName -Value $updatedContent -NoNewline -Encoding utf8 -ErrorAction Stop
                $null = $modifiedResources.Add($resourceName)
                $syntheticDifferenceCount++
                Write-Host "Changed the copied $resourceName.$propertyName value in '$($configuration.FullName)' because no Ensure assignment was available."
                $modifiedEnsure = $true
                break
              }
              if ($modifiedEnsure) {
                break
              }
            }
            if (-not $modifiedEnsure) {
              switch ($resourceName) {
                'AADAuthenticationMethodPolicy' {
                  Set-SyntheticPairedProperty -ResourceName $resourceName -PropertyName 'ReconfirmationInDays' -SourceValue '30' -DestinationValue '31'
                  $syntheticDifferenceCount++
                  $modifiedEnsure = $true
                }
                'AADAuthenticationMethodPolicyExternal' {
                  $displayName = "DeltaReportExternal-$marker"
                  $sourceBlock = @(
                    "        AADAuthenticationMethodPolicyExternal '$displayName'"
                    '        {'
                    "            DisplayName = '$displayName'"
                    "            State = 'enabled'"
                    "            Ensure = 'Present'"
                    '        }'
                  ) -join [Environment]::NewLine
                  $destinationBlock = $sourceBlock.Replace("State = 'enabled'", "State = 'disabled'")
                  Add-SyntheticResourcePair -ResourceName $resourceName -SourceBlock $sourceBlock -DestinationBlock $destinationBlock
                  $syntheticDifferenceCount++
                  $modifiedEnsure = $true
                }
                'AADAuthenticationStrengthPolicy' {
                  $displayName = "DeltaTest-$marker"
                  $sourceBlock = @(
                    "        AADAuthenticationStrengthPolicy '$displayName'"
                    '        {'
                    "            DisplayName = '$displayName'"
                    "            Description = 'Source synthetic strength $marker'"
                    "            Ensure = 'Present'"
                    '        }'
                  ) -join [Environment]::NewLine
                  $destinationBlock = $sourceBlock.Replace("Description = 'Source synthetic strength $marker'", "Description = 'Destination synthetic strength $marker'")
                  Add-SyntheticResourcePair -ResourceName $resourceName -SourceBlock $sourceBlock -DestinationBlock $destinationBlock
                  $syntheticDifferenceCount++
                  $modifiedEnsure = $true
                }
                'AADAuthenticationContextClassReference' {
                  $sourceConfigurationText = (Get-ChildItem -LiteralPath $sourceFolders[0] -Filter '*.ps1' -File -Recurse -ErrorAction Stop |
                    ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw -ErrorAction Stop }) -join [Environment]::NewLine
                  $contextId = $null
                  foreach ($contextNumber in 1..25) {
                    $candidateId = "c$contextNumber"
                    $idPattern = '(?im)\bId\s*=\s*[''"]' + [regex]::Escape($candidateId) + '[''"]'
                    if ($sourceConfigurationText -notmatch $idPattern) {
                      $contextId = $candidateId
                      break
                    }
                  }
                  if (-not $contextId) {
                    throw "No unused authentication-context ID is available for synthetic drift in '$sourceTenant'."
                  }

                  $displayName = "DeltaCtx-$marker"
                  $sourceBlock = @(
                    "        AADAuthenticationContextClassReference '$contextId'"
                    '        {'
                    "            Id = '$contextId'"
                    "            DisplayName = '$displayName'"
                    "            IsAvailable = `$false"
                    "            Ensure = 'Present'"
                    '        }'
                  ) -join [Environment]::NewLine
                  $destinationBlock = $sourceBlock.Replace('IsAvailable = $false', 'IsAvailable = $true')
                  Add-SyntheticResourcePair -ResourceName $resourceName -SourceBlock $sourceBlock -DestinationBlock $destinationBlock
                  $syntheticDifferenceCount++
                  $modifiedEnsure = $true
                }
              }
            }
            if (-not $modifiedEnsure) {
              Write-Warning "No writable scalar export assignment was found for '$resourceName' in '$sourceTenant'; no synthetic drift was added for this resource."
            }
          }

          $resourcesWithoutDrift = @($exportedResourceNames | Where-Object { -not $modifiedResources.Contains($_) })
          if ($resourcesWithoutDrift.Count -gt 0) {
            throw "Could not create synthetic drift for all configured resources in '$sourceTenant'. No writable export assignment was found for: $($resourcesWithoutDrift -join ', ')."
          }

          Write-Host "Created synthetic destination '$syntheticTenant' with drift for all $($exportedResourceNames.Count) resources from ExportConfiguration.yml, using $syntheticDifferenceCount copied PS1 property differences."
          Write-Host 'This is a test-only copy; no tenant, subscription, or VM agent was created.'
      env:
        DeltaReportInputDirectory: $(Pipeline.Workspace)/exportPipeline
        DeltaReportSourceTenant: ${{ parameters.sourceTenant }}

  - task: PowerShell@2
    name: InitializeModuleFolder
    displayName: Initialize Program Files Modules
    inputs:
      pwsh: true
      filePath: ./build.ps1
      arguments: -ResolveDependency -Tasks InitializeModuleFolderForDeltaReport #-UseModuleFast

  - task: PowerShell@2
    name: deltaReport
    displayName: Create Delta Report
    inputs:
      pwsh: true
      filePath: ./build.ps1
      arguments: -Tasks deltaReport
    env:
      DeltaReportInputDirectory: $(Pipeline.Workspace)/exportPipeline
      DeltaReportSourceTenant: ${{ parameters.sourceTenant }}
      DeltaReportAnonymizeTenantIdentifiers: ${{ parameters.anonymizeTenantIdentifiers }}

  - task: PublishPipelineArtifact@1
    displayName: Publish Delta Report
    inputs:
      targetPath: $(buildFolderName)/DeltaReport
      artifact: DeltaReport
      publishLocation: pipeline
      parallel: true
