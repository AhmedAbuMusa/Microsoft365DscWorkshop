parameters:
  - name: poolName
    type: string

stages:
  - stage: Export
    displayName: Export tenant configuration
    dependsOn: GenerateBuildEnvironmentMatrix
    jobs:
      - job: Export
        displayName: Export of $(BuildEnvironment)
        strategy:
          matrix: $[ stageDependencies.GenerateBuildEnvironmentMatrix.CreateBuildEnvironmentMatrix.outputs['setMatrix.buildEnvironmentMatrix'] ]
        pool:
          name: ${{ parameters.poolName }}
          demands:
            - buildEnvironment -equals $(BuildEnvironment)
        steps:
          - task: PowerShell@2
            name: displayEnvVariables
            displayName: Display Environment Variables
            inputs:
              targetType: inline
              pwsh: true
              script: |
                dir -Path env: | Format-Table -Property Name, Value -AutoSize | Out-String | Write-Host

          - task: PowerShell@2
            name: InitializeModuleFolder
            displayName: Initialize Program Files Modules
            inputs:
              pwsh: true
              filePath: ./build.ps1
              arguments: -ResolveDependency -Tasks InitializeModuleFolder

          - task: PowerShell@2
            name: runtimePreflight
            displayName: Verify PowerShell and export modules
            inputs:
              pwsh: true
              filePath: ./pipelines/scripts/TestBuildRuntime.ps1
              arguments: -IncludeExchangeOnlineManagement

          - task: PowerShell@2
            name: ExportTenantConfig
            displayName: Export Tenant Configuration
            inputs:
              pwsh: true
              filePath: ./build.ps1
              arguments: -Tasks export

          - task: PowerShell@2
            name: ConvertTenantConfig
            displayName: Convert Exported Tenant Configuration
            inputs:
              pwsh: true
              filePath: ./build.ps1
              arguments: -Tasks exportConvert
            continueOnError: true

          - task: PublishPipelineArtifact@1
            displayName: Publish Exported Data
            inputs:
              targetPath: "$(buildFolderName)/Export"
              artifact: TenantConfig-$(BuildEnvironment)
              publishLocation: pipeline
              parallel: true
