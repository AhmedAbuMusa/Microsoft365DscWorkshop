parameters:
- name: poolName
  type: string

stages:
- stage: StartConfiguration
  displayName: Start DSC configuration
  dependsOn:
  - GenerateBuildEnvironmentMatrix
  - Build
  jobs:
  - job: StartConfiguration
    displayName: Deploy to $(BuildEnvironment)
    strategy:
      matrix: $[ stageDependencies.GenerateBuildEnvironmentMatrix.CreateBuildEnvironmentMatrix.outputs['setMatrix.buildEnvironmentMatrix'] ]
    pool:
      name: ${{ parameters.poolName }}
      demands:
      - buildEnvironment -equals $(BuildEnvironment)
    steps:
    - download: None

    - task: DownloadPipelineArtifact@2
      name: downloadMof
      displayName: Download compiled MOF for $(BuildEnvironment)
      inputs:
        buildType: current
        artifactName: MOF_$(BuildEnvironment)
        targetPath: '$(System.DefaultWorkingDirectory)\output\MOF'

    - task: PowerShell@2
      name: displayEnvVariables2
      displayName: Display Environment Variables
      inputs:
        targetType: inline
        script: |
          dir -Path env: | Format-Table -Property Name, Value -AutoSize | Out-String | Write-Host

    - task: PowerShell@2
      name: initializeModules
      displayName: Initialize patched DSC modules
      inputs:
        filePath: ./build.ps1
        arguments: -ResolveDependency -Tasks InitializeModuleFolder
        pwsh: true

    - task: PowerShell@2
      name: deploy
      displayName: Deploy DSC Configuration
      inputs:
        filePath: ./build.ps1
        arguments: -Tasks startConfiguration
        pwsh: false
