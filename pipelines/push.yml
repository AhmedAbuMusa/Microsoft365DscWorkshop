trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - CHANGELOG.md
  tags:
    include:
    - v*
    exclude:
    - '*-*'
pool:
  vmImage: windows-latest
variables:
  buildFolderName: output
  testResultFolderName: testResults
  defaultBranch: main
  Agent.Source.Git.ShallowFetchDepth: 0
parameters:
- name: poolName
  type: string
  default: DSC
- name: environments
  displayName: Environments
  type: stringList
  default:
    - Dev
    - Test
  values:
    - Dev
    - Test
stages:
- template: environmentMatrixTemplate.yml
  parameters:
    environments: ${{ parameters.environments }}
- template: buildTemplate.yml
  parameters:
    poolName: ${{ parameters.poolName }}
- template: startDscTemplate.yml
  parameters:
    poolName: ${{ parameters.poolName }}
- template: testDscTemplate.yml
  parameters:
    poolName: ${{ parameters.poolName }}
    validateDeployment: true
    dependsOnStage: StartConfiguration
